name: devicebridge-dev

services:
  db:
    image: postgres:17-bookworm
    user: postgres
    environment:
      POSTGRES_DB: devicebridge
      POSTGRES_USER: devicebridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env or the environment}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/opt/devicebridge/migrations:ro
      - ./migrate.sh:/opt/devicebridge/migrate.sh:ro
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20]
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    shm_size: 64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
