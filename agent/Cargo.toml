[package]
name = "devicebridge-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
